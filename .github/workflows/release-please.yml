name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ startsWith(github.ref, 'refs/heads/') }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json

  format-changelog:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate formatted changelog
        id: changelog
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          # Find the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, skipping changelog formatting"
            exit 0
          fi
          NOTES=$(bash scripts/generate-changelog.sh "$PREV_TAG" "$TAG")
          # Write to file for multiline output
          echo "$NOTES" > /tmp/release-notes.md

      - name: Update release notes
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          gh release edit "$TAG" --notes-file /tmp/release-notes.md --repo dongdong306/hailux

  build-binaries:
    needs: release-please
    if: ${{ always() && !failure() && (startsWith(github.ref, 'refs/tags/v') || needs.release-please.outputs.release_created == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: hailux-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: hailux-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          cp hailux${{ matrix.os == 'windows-latest' && '.exe' || '' }} ${{ matrix.artifact }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || needs.release-please.outputs.tag_name }}
          files: target/${{ matrix.target }}/release/${{ matrix.artifact }}
