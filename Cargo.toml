[package]
name = "hailux"
version = "0.6.0"
edition = "2024"
rust-version = "1.96.0"
description = "一个基于终端的 AI 编程助手，支持流式对话、工具调用、MCP 协议与可扩展技能系统"
license = "MIT"
repository = "https://github.com/dongdong306/hailux"
keywords = ["ai", "cli", "tui", "coding-assistant", "llm"]
categories = ["command-line-utilities", "development-tools"]

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3

[dependencies]
async-openai = { version = "0.41.1", features = ["chat-completion", "byot"] }
reqwest = "0.13"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs", "process", "io-std", "time"] }
rmcp = { version = "2.1", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
http = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
chrono = "0.4"
serde_json = "1"
serde = { version = "1.0.228", features = ["derive"] }
mdka = "2"
grep = "0.4"
ignore = "0.4"
globset = "0.4"
indoc = "2"
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
crossterm = { version = "0.29", features = ["event-stream"] }
color-eyre = "0.6"
unicode-width = "0.2"
textwrap = "0.16"
pulldown-cmark = "0.13"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
toml = { version = "1.1", features = ["preserve_order"] }
similar = { version = "3", features = ["text"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
crossterm_winapi = "0.9"
